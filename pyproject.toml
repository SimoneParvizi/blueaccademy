[project]
name = "blueaccademy"
author = "Simone Parvizi"
version = "0.1.0"
description = "Python services for blueaccademy, including the API and infrastructure"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
packages = [
    { include = "blueaccademy" },
    { include = "backend", from = "blueaccademy" },
]
dependencies = [
  "alembic>=1.14.0",
  "asyncssh>=2.15.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.0",
  "jsonformatter>=0.3.4",
  "fastapi[standard]>=0.136.3"
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.16",
    "ty>=0.0.46",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
    "just>=0.8.165",
]

[tool.pytest.ini_options]
addopts = "--no-header"
pythonpath = ["."]
testpaths = ["backend/tests/unit"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.fastapi]
entrypoint = "backend.app.main:app"
